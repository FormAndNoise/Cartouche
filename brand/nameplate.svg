<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="880" height="200" fill="none">
  <rect width="440" height="100" fill="#0B0B0B"/>
  
  <!-- Snug Stadium Enclosure -->
  <rect x="20" y="16" width="355" height="68" rx="34" 
        stroke="#6FA0BE" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Trailing Knot Seal Bar -->
  <line x1="405" y1="10" x2="405" y2="90" 
        stroke="#6FA0BE" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Dual Knot Binding Loops -->
  <line x1="375" y1="36" x2="405" y2="36" stroke="#6FA0BE" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="375" y1="64" x2="405" y2="64" stroke="#6FA0BE" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Geometrically Dead-Centered CARTOUCHE -->
  <text x="197.5" y="60" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="33" font-weight="700" letter-spacing="3.8" fill="#F2EEE8" text-anchor="middle">CARTOUCHE</text>
  
  <!-- Solid State Pip inside right aperture -->
  <circle cx="350" cy="50" r="4.5" fill="#D45500"/>
</svg>