<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" fill="none">
  <rect width="1200" height="400" fill="#F6F1EA"/>
  
  <!-- Left: Card Socket Icon -->
  <g transform="translate(100, 80) scale(10)">
    <rect x="6.5" y="3" width="11" height="14.5" rx="2" 
          stroke="#3F6E8C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="4.5" y1="20.25" x2="19.5" y2="20.25" stroke="#3F6E8C" stroke-width="1.75" stroke-linecap="round"/>
    <line x1="8.75" y1="17.5" x2="8.75" y2="20.25" stroke="#3F6E8C" stroke-width="1.75" stroke-linecap="round"/>
    <line x1="15.25" y1="17.5" x2="15.25" y2="20.25" stroke="#3F6E8C" stroke-width="1.75" stroke-linecap="round"/>
    <circle cx="12" cy="10.25" r="1.3" fill="#D45500" stroke="none"/>
  </g>
  
  <line x1="390" y1="80" x2="390" y2="320" stroke="#E2DDD5" stroke-width="1"/>
  
  <!-- Right: Snug Nameplate & Lockup -->
  <g transform="translate(440, 115)">
    <rect x="0" y="0" width="530" height="110" rx="55" 
          stroke="#3F6E8C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="585" y1="-10" x2="585" y2="120" stroke="#3F6E8C" stroke-width="6" stroke-linecap="round"/>
    <line x1="530" y1="33" x2="585" y2="33" stroke="#3F6E8C" stroke-width="6" stroke-linecap="round"/>
    <line x1="530" y1="77" x2="585" y2="77" stroke="#3F6E8C" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Centered text inside oval -->
    <text x="265" y="68" font-family="'Space Grotesk', -apple-system, sans-serif" 
          font-size="52" font-weight="700" letter-spacing="4.5" fill="#141414" text-anchor="middle">CARTOUCHE</text>
    
    <!-- Internal State Pip -->
    <circle cx="488" cy="55" r="7.5" fill="#D45500"/>
    
    <!-- Invariant job line -->
    <text x="0" y="160" font-family="'Inter', sans-serif" font-size="17" fill="#6B6763">Local workspace to stage, audition, and lock artwork into ordered deliverable grids.</text>
    <text x="0" y="195" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="500" letter-spacing="1.5" fill="#3F6E8C">FORM &amp; NOISE ATELIER  •  TAURI 2  •  REACT 19  •  SQLITE</text>
  </g>
</svg>